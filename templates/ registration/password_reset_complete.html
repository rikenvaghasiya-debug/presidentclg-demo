<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Changed | PG Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(13,110,253,.15), transparent 35%),
                radial-gradient(circle at bottom right, rgba(25,135,84,.13), transparent 35%),
                #f5f7fb;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .success-card {
            width: 100%;
            max-width: 520px;
            border: 0;
            border-radius: 26px;
            background: white;
            padding: 50px 45px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(15,23,42,.13);
        }

        .success-icon {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f7ef, #dff5e8);
            color: #198754;
            font-size: 52px;
        }

        .title {
            font-size: 29px;
            font-weight: 750;
            color: #111827;
            margin-bottom: 13px;
        }

        .description {
            color: #6b7280;
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .success-message {
            padding: 15px;
            border-radius: 13px;
            background: #f0faf4;
            border: 1px solid #d8f0e1;
            color: #35704c;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-btn {
            height: 53px;
            border-radius: 12px;
            border: 0;
            font-weight: 650;
            background: linear-gradient(135deg, #0d6efd, #4f46e5);
            box-shadow: 0 10px 22px rgba(13,110,253,.20);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 575px) {

            .success-card {
                padding: 40px 25px;
            }

            .title {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>

<div class="page-wrapper">

    <div class="success-card">

        <div class="success-icon">

            <i class="bi bi-check-lg"></i>

        </div>


        <h1 class="title">

            Password Changed Successfully!

        </h1>


        <p class="description">

            Your password has been successfully updated.

            <br>

            Your account is now protected with your new password.

        </p>


        <div class="success-message">

            <i class="bi bi-shield-check me-2"></i>

            You can now securely log in using your new password.

        </div>


        <a href="{% url 'login' %}"
           class="btn btn-primary login-btn w-100">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Continue to Login

        </a>


        <div class="footer">

            © 2026 PG Management System

        </div>

    </div>

</div>

</body>

</html>
