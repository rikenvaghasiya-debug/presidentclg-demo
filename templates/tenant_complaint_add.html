{% extends 'base.html' %}

{% block title %}
Submit Complaint
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card shadow-lg border-0">

                <!-- Header -->
                <div class="card-header bg-danger text-white text-center py-3">

                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Submit Complaint
                    </h4>

                    <small>
                        Report any issue related to your PG
                    </small>

                </div>


                <!-- Form -->
                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}


                        <!-- Tenant Name -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Tenant Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ tenant.full_name }}"
                                readonly
                            >

                        </div>


                        <!-- Subject -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Complaint Subject
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                name="subject"
                                class="form-control"
                                placeholder="Example: Water leakage in bathroom"
                                required
                            >

                        </div>


                        <!-- Description -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Complaint Description
                                <span class="text-danger">*</span>
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe your problem in detail..."
                                required
                            ></textarea>

                        </div>


                        <!-- Priority -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select"
                            >

                                <option value="Low">
                                    Low
                                </option>

                                <option value="Medium" selected>
                                    Medium
                                </option>

                                <option value="High">
                                    High
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">

                            <a
                                href="{% url 'tenant_dashboard' %}"
                                class="btn btn-secondary"
                            >
                                <i class="bi bi-arrow-left"></i>
                                Back
                            </a>


                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                <i class="bi bi-send-fill"></i>
                                Submit Complaint
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
