{% extends 'base.html' %}

{% block title %}Edit Payment{% endblock %}

{% block content %}

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="bi bi-pencil-square"></i>
                Edit Payment
            </h2>

            <p class="text-muted mb-0">
                Update payment information
            </p>
        </div>

        <a href="{% url 'payment_list' %}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>
            Back

        </a>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white">

                    <h5 class="mb-0">
                        <i class="bi bi-credit-card"></i>
                        Payment Information
                    </h5>

                </div>


                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row">


                            <!-- Tenant -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Tenant
                                </label>

                                <select
                                    name="tenant"
                                    class="form-select"
                                    required>

                                    {% for tenant in tenants %}

                                    <option
                                        value="{{ tenant.id }}"
                                        {% if payment.tenant.id == tenant.id %}
                                            selected
                                        {% endif %}>

                                        {{ tenant.full_name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <!-- Amount -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Amount
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        ₹
                                    </span>

                                    <input
                                        type="number"
                                        name="amount"
                                        class="form-control"
                                        value="{{ payment.amount }}"
                                        min="1"
                                        step="0.01"
                                        required>

                                </div>

                            </div>


                            <!-- Payment Method -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Payment Method
                                </label>

                                <select
                                    name="payment_method"
                                    class="form-select"
                                    required>

                                    <option
                                        value="Cash"
                                        {% if payment.payment_method == "Cash" %}
                                            selected
                                        {% endif %}>
                                        Cash
                                    </option>

                                    <option
                                        value="UPI"
                                        {% if payment.payment_method == "UPI" %}
                                            selected
                                        {% endif %}>
                                        UPI
                                    </option>

                                    <option
                                        value="Card"
                                        {% if payment.payment_method == "Card" %}
                                            selected
                                        {% endif %}>
                                        Card
                                    </option>

                                </select>

                            </div>


                            <!-- Status -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Payment Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select"
                                    required>

                                    <option
                                        value="Paid"
                                        {% if payment.status == "Paid" %}
                                            selected
                                        {% endif %}>
                                        Paid
                                    </option>

                                    <option
                                        value="Pending"
                                        {% if payment.status == "Pending" %}
                                            selected
                                        {% endif %}>
                                        Pending
                                    </option>

                                </select>

                            </div>


                            <!-- Transaction ID -->
                            <div class="col-12 mb-3">

                                <label class="form-label fw-semibold">
                                    Transaction ID
                                    <span class="text-muted">
                                        (Optional)
                                    </span>
                                </label>

                                <input
                                    type="text"
                                    name="transaction_id"
                                    class="form-control"
                                    value="{{ payment.transaction_id|default:'' }}"
                                    placeholder="Enter transaction ID">

                            </div>


                            <!-- Description -->
                            <div class="col-12 mb-3">

                                <label class="form-label fw-semibold">
                                    Description
                                    <span class="text-muted">
                                        (Optional)
                                    </span>
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter payment description">{{ payment.description|default:'' }}</textarea>

                            </div>

                        </div>


                        <hr class="my-4">


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary px-4">

                                <i class="bi bi-check-circle"></i>
                                Update Payment

                            </button>


                            <a
                                href="{% url 'payment_list' %}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
